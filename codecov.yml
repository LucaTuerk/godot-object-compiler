comment:
  layout: "header, diff, flags, components"

component_management:
  default_rules:
    statuses:
      - type: project # in this case every component that doens't have a status defined will have a project type one
        target: auto
        branches:
          - "!main"
  individual_components:
    - component_id: programs
      name: Programs
      paths:
        - src/application/programs/**
    - component_id: generators
      name: Generators
      paths:
        - src/library_godot/generators/**
    - component_id: parser_clang
      name: ClangParser
      paths:
        - src/library/parsers/libclang/**
    - component_id: parser_treesitter
      name: TreeSitterParser
      paths:
        - src/library/parsers/tree-sitter/**