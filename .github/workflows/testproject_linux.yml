name: Linux Run Test Project
on:
  workflow_call:
    inputs:
      create_artifact:
        required: false
        type: boolean
        default: false

jobs:
  linux-test-project:
    name: Run Test Project (Linux 🐧)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Test Repo
        uses: actions/checkout@v6
        with:
          repository: "LucaTuerk/godot-object-compiler-test"
          submodules: "false"

      - name: Checkout Godot Object Compiler
        uses: actions/checkout@v6
        with:
          repository: "LucaTuerk/godot-object-compiler"
          submodules: "recursive"
          path: "godot-object-compiler"

      - name: Checkout godot-cpp
        uses: actions/checkout@v6
        with:
          repository: "godotengine/godot-cpp"
          submodules: "true"
          path: "godot-cpp"
          ref: "4.5"

      - name: Install Packages
        run: |
          sudo apt update
          sudo apt install cmake -y

      - name: Setup libclang
        uses: ./godot-object-compiler/.github/actions/setup_libclang
        with:
          platform: "linux"

      - name: Build Project
        run: |
          mkdir -p build
          cmake -Bbuild -S. -DCMAKE_BUILD_TYPE=Release -DClang_DIR=${{github.workspace}}/libclang/lib/cmake/clang/
          cmake --build build --parallel $(getconf _NPROCESSORS_ONLN)

      - name: Install Godot
        shell: bash
        run: |
          INSTALL_DIR=${HOME}/.godot-install-dir/4.5.1-stable
          mkdir -p $INSTALL_DIR

          echo "Creating $INSTALL_DIR"

          GODOT_DOWNLOAD_URL=https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip

          echo "Downloading: $GODOT_DOWNLOAD_URL"

          cd $INSTALL_DIR
          wget -O godot.zip -q $GODOT_DOWNLOAD_URL
          unzip godot.zip
          rm -rf godot.zip

          mv Godot_v4.5.1-stable_linux.x86_64 godot

          ls -la $INSTALL_DIR
          echo $INSTALL_DIR >> $GITHUB_PATH

      - name: Run Project
        run: |
          godot --headless --path project --editor --quit || true # Godot 4.5.1 crashes after successful import, ignore for now
          godot --headless --path project

      - name: Upload Binary
        if: ${{inputs.create_artifact == true}}
        uses: actions/upload-artifact@v7
        with:
          name: linux-binary
          path: build/godot-object-compiler/goc
          compression-level: 9
          if-no-files-found: error
          overwrite: true
