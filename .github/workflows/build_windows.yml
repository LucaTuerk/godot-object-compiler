name: Windows Build
on:
  workflow_call:
    inputs:
      create_artifact:
        required: false
        type: boolean
        default: false
jobs:
  windows-build:
    name: Build (Windows 🪟)
    runs-on: windows-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          submodules: "true"

      - name: Install Packages
        run: |
          choco install tree-sitter

      - name: Setup libclang
        uses: ./.github/actions/setup_libclang
        with:
          platform: "windows"

      - name: Build Project
        run: |
          mkdir build -Force
          cmake -Bbuild -S. -DGOC_TESTS_ENABLED=ON -DClang_DIR=libclang/lib/cmake/clang/
          cmake --build build --config Release --parallel $(Get-CimInstance -ClassName Win32_ComputerSystem).NumberOfLogicalProcessors

      - name: Checkout godot-cpp
        uses: actions/checkout@v7
        with:
          repository: "godotengine/godot-cpp"
          ref: "4.5"
          path: "godot-cpp"

      - name: Generate godot-cpp bindings
        run: |
          cd godot-cpp
          mkdir build -Force
          cd build
          cmake ..
          cmake --build . --target generate_bindings

      - name: Run Tests
        run: |
          ./build/goc_tests.exe run_integration_tests godot-cpp/gdextension/extension_api.json godot-cpp/include godot-cpp/build/gen/include godot-cpp/gdextension

      - name: Upload Binary
        if: ${{inputs.create_artifact == true}}
        uses: actions/upload-artifact@v7
        with:
          name: windows-binary
          path: build/goc.exe
          compression-level: 9
          if-no-files-found: error
          overwrite: true
