name: Windows Build
on:
  workflow_call:
    inputs:
      create_artifact:
        required: false
        type: boolean
        default: false
    secrets:
      GOC_RUNNER_TOKEN:
        required: true
jobs:
  windows-build:
    name: Build (Windows 🪟)
    runs-on: windows-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Download TreeSitterCLI
        run: |
          Invoke-WebRequest https://github.com/tree-sitter/tree-sitter/releases/download/v0.26.5/tree-sitter-windows-x64.gz -OutFile .\tree-sitter.gz
          7z.exe e .\tree-sitter.gz

      - name: Build Project
        run: |
          mkdir build
          cd build
          cmake .. -DGOC_TESTS_ENABLED=ON -DTREE_SITTER_CLI=.\tree-sitter.exe
          cmake --build . --config Release
          cd ..

      - name: Checkout godot-cpp
        uses: actions/checkout@v4
        with:
          repository: "godotengine/godot-cpp"
          ref: "4.5"
          path: "godot-cpp"
          token: ${{secrets.GOC_RUNNER_TOKEN}}
      #
      - name: Install Scons
        run: |
          python.exe -m pip install scons

      - name: Generate godot-cpp
        run: |
          cd godot-cpp
          scons
          cd ..

      - name: Run Tests
        run: |
          ./build/goc_tests.exe run_integration_tests godot-cpp/include godot-cpp/gen/include

      - name: Upload Binary
        if: ${{inputs.create_artifact == true}}
        uses: actions/upload-artifact@v6
        with:
          name: windows-binary
          path: build/goc.exe
          compression-level: 9
          if-no-files-found: error
          overwrite: true
