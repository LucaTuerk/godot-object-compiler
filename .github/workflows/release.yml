name: Release Workflow
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  get-tag:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{steps.get.tag}}
    steps:
      - name: Get Version Tag
        id: get
        run: |
          if [ "${{github.event.release.tag_name}}" = ""]; then
            echo "tag=nightly" >> ${GITHUB_OUTPUT}
          else
            echo "tag=${{github.event.release.tag_name}}" >> ${GITHUB_OUTPUT}

  check-changed:
    runs-on: ubuntu-22.04
    outputs:
      result: ${{ steps.compare.outputs.result }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: get-tag
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7
      - id: compare
        name: Compare Commit Hashes
        run: |
          gh release download ${{needs.get-tag.outputs.tag}} -p goc_${{needs.get-tag.outputs.tag}}-linux.x86_64.zip
          unzip goc_${{needs.get-tag.outputs.tag}}-linux.x86_64.zip
          chmod +x ./linux/goc
          ./linux/goc build_num >> last_hash
          git rev-parse HEAD >> current_hash
          diff last_hash current_hash && echo "result=0" >> ${GITHUB_OUTPUT} || echo "result=1" >> ${GITHUB_OUTPUT}

  check-format:
    needs: check-changed
    if: ${{ needs.check-changed.outputs.result == 1 }}
    uses: ./.github/workflows/format.yml

  linux-build:
    uses: ./.github/workflows/build_linux.yml
    needs: check-format
    secrets:
      CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}
    with:
      create_artifact: true

  windows-build:
    uses: ./.github/workflows/build_windows.yml
    needs: check-changed
    if: ${{ needs.check-changed.outputs.result == 1 }}
    with:
      create_artifact: true

  mac-build:
    uses: ./.github/workflows/build_mac.yml
    needs: check-changed
    if: ${{ needs.check-changed.outputs.result == 1 }}
    with:
      create_artifact: true

  run-testproject:
    uses: ./.github/workflows/testproject.yml
    needs: check-changed

  upload-artifacts:
    name: Upload release artifacts
    runs-on: ubuntu-22.04
    needs: [linux-build, windows-build, mac-build, run-testproject, get-tag]
    if: ${{ needs.check-changed.outputs.result == 1 && needs.get-tag.outputs.tag == 'nightly'}}
    permissions:
      contents: write
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          submodules: "false"

      - name: Download Linux Artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-binary
          path: linux

      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-binary
          path: windows

      - name: Download Mac Artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-binary
          path: macos

      - name: Add Artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip goc_${{needs.get-tag.outputs.tag}}-linux.x86_64.zip linux/goc
          zip goc_${{needs.get-tag.outputs.tag}}-win64.zip windows/goc.exe
          zip goc_${{needs.get-tag.outputs.tag}}-macos.universal.zip macos/goc

          gh release upload ${{needs.get-tag.outputs.tag}} goc_${{needs.get-tag.outputs.tag}}-linux.x86_64.zip --clobber
          gh release upload ${{needs.get-tag.outputs.tag}} goc_${{needs.get-tag.outputs.tag}}-win64.zip --clobber
          gh release upload ${{needs.get-tag.outputs.tag}} goc_${{needs.get-tag.outputs.tag}}-macos.universal.zip --clobber

      - uses: Ayowel/butler-to-itch@v1
        with:
          butler_key: ${{ secrets.BUTLER_API_KEY }}
          itch_user: lucatuerk
          itch_game: godot-object-compiler
          version: ${{needs.get-tag.outputs.tag}}
          files: |
            windows windows/goc.exe
            linux linux/goc
            mac macos/goc
