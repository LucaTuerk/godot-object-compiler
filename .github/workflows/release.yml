name: Release Workflow
on:
  push:
    tags:
      - "v*"

jobs:
  check-format:
    uses: ./.github/workflows/format.yml

  linux-build:
    uses: ./.github/workflows/build_linux.yml
    needs: check-format
    secrets:
      CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}
    with:
      create_artifact: true

  windows-build:
    uses: ./.github/workflows/build_windows.yml
    needs: check-format
    with:
      create_artifact: true

  mac-build:
    uses: ./.github/workflows/build_mac.yml
    needs: check-format
    with:
      create_artifact: true

  run-testproject:
    needs: check-format
    uses: ./.github/workflows/testproject.yml

  upload-artifacts:
    name: Upload release artifacts
    runs-on: ubuntu-22.04
    needs: [linux-build, windows-build, mac-build, run-testproject]
    permissions:
      contents: write
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          submodules: "false"

      - name: Download Linux Artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-binary
          path: linux

      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-binary
          path: windows

      - name: Download Mac Artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-binary
          path: macos

      - name: Add Artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip goc_${{github.ref_name}}-linux.x86_64.zip linux/goc
          zip goc_${{github.ref_name}}-win64.zip windows/goc.exe
          zip goc_${{github.ref_name}}-macos.universal.zip macos/goc

          gh release upload ${{github.ref_name}} goc_${{github.ref_name}}-linux.x86_64.zip --clobber
          gh release upload ${{github.ref_name}} goc_${{github.ref_name}}-win64.zip --clobber
          gh release upload ${{github.ref_name}} goc_${{github.ref_name}}-macos.universal.zip --clobber

      - uses: Ayowel/butler-to-itch@v2
        with:
          butler_key: ${{ secrets.BUTLER_API_KEY }}
          itch_user: lucatuerk
          itch_game: godot-object-compiler
          version: ${{github.ref_name}}
          files: |
            windows windows/goc.exe
            linux linux/goc
            mac macos/goc
