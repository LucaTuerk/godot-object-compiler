name: Workflow
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  check-format:
    uses: ./.github/workflows/format.yml

  linux-build:
    uses: ./.github/workflows/build_linux.yml
    needs: check-format
    secrets:
      GOC_RUNNER_TOKEN: ${{secrets.GOC_RUNNER_TOKEN}}

  windows-build:
    uses: ./.github/workflows/build_windows.yml
    needs: check-format
    secrets:
      GOC_RUNNER_TOKEN: ${{secrets.GOC_RUNNER_TOKEN}}

  mac-build:
    uses: ./.github/workflows/build_mac.yml
    needs: check-format
    secrets:
      GOC_RUNNER_TOKEN: ${{secrets.GOC_RUNNER_TOKEN}}
